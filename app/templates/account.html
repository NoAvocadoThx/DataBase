{% extends "base.html" %}{% block body %}
<h2>我的账户</h2>
<div class="card" style="max-width:520px"><div style="display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.92rem">
<b class="muted">用户名</b><span class="mono">{{user.username}}</span><b class="muted">姓名</b><span>{{user.display_name or '—'}}</span>
<b class="muted">角色</b><span>{{ {'admin':'管理员','planner':'策划','intern':'实习生'}[user.role] }}</span></div></div>
<div class="card" style="max-width:520px"><h3>修改密码</h3>
<form method="post" action="/password" style="display:grid;gap:10px;max-width:320px">
<div><label>原密码</label><input name="old" type="password" required class="w"></div>
<div><label>新密码 <span class="muted">至少 6 位</span></label><input name="new" type="password" required minlength="6" class="w"></div>
<div><label>再输一次新密码</label><input name="new2" type="password" required minlength="6" class="w"></div>
<div><button>修改密码</button></div></form></div>
{% endblock %}
