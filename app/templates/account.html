{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:480px"><h3 style="margin-top:0">我的账户</h3>
<p><b>用户名：</b>{{user.username}} &nbsp; <b>姓名：</b>{{user.display_name or '—'}} &nbsp; <b>角色：</b>{{ {'admin':'管理员','planner':'策划','intern':'实习生'}[user.role] }}</p>
<h4>修改密码</h4>
<form method="post" action="/password" style="display:grid;gap:8px;max-width:320px">
<input name="old" type="password" placeholder="原密码" required>
<input name="new" type="password" placeholder="新密码（至少 6 位）" required minlength="6">
<input name="new2" type="password" placeholder="再输一次新密码" required minlength="6">
<button>修改密码</button></form></div>
{% endblock %}
