{% extends "base.html" %}{% block body %}
<div class="card"><form>
<input type="hidden" name="role" value="{{role}}">
<input name="q" value="{{q}}" placeholder="姓名/单位/方向关键词" style="width:260px">
<input name="org" value="{{org}}" placeholder="单位">
<select name="tag"><option value="">全部标签</option>{% for t in tags %}<option {% if t.name==tag %}selected{% endif %}>{{t.name}}</option>{% endfor %}</select>
<button>筛选</button> <span class="muted">共 {{total}} 位专家，当前 {{experts|length}} 位</span></form></div>
<div class="card"><table><tr><th>姓名</th><th>单位</th><th>职务</th><th>研究方向</th><th>标签</th><th>手机</th></tr>
{% for e in experts %}<tr><td><a href="/expert/{{e.id}}?role={{role}}">{{e.name}}</a></td><td>{{e.org}}</td><td>{{e.title}}</td>
<td>{{e.field}}</td><td>{% for t in e.tags %}<span class="tag">{{t.name}}</span>{% endfor %}</td><td>{{e.phone}}</td></tr>
{% else %}<tr><td colspan="6" class="muted">暂无数据，请先 <a href="/import?role=admin">导入 Excel</a></td></tr>{% endfor %}</table></div>
{% endblock %}
