{% extends "base.html" %}{% block body %}
<div style="max-width:380px;margin:12vh auto 0">
<div class="card" style="padding:28px 30px;border-top:4px solid var(--teal)">
<div style="font-weight:700;font-size:1.3rem;letter-spacing:.06em;margin-bottom:2px"><span style="color:var(--teal)">同写意</span> 专家智库</div>
<div class="muted" style="margin-bottom:22px">内部系统 · 请使用分配的账号登录</div>
<form method="post" style="display:grid;gap:10px"><input type="hidden" name="next" value="{{next}}">
<div><label for="u">用户名</label><input id="u" name="username" required class="w" autofocus></div>
<div><label for="p">密码</label><input id="p" name="password" type="password" required class="w"></div>
<button class="w" style="margin-top:6px;justify-content:center">登录</button></form>
</div>
<p class="muted" style="text-align:center">忘记密码请联系管理员重置</p></div>
{% endblock %}
